<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panel de Licencias</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0a0a2e;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
  }

  /* ---------- LOGIN ---------- */
  #pantallaLogin {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #pantallaLogin .caja {
    width: min(360px, 100%);
    background: rgba(255,255,255,0.06);
    border-radius: 16px;
    padding: 28px;
    text-align: center;
  }
  #pantallaLogin h1 {
    color: #ffe600;
    font-size: 1.2rem;
    margin: 0 0 18px;
  }
  #pantallaLogin input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    margin-bottom: 10px;
    font-size: 1rem;
  }
  #pantallaLogin button {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: #ffe600;
    color: #000;
    font-weight: 800;
    font-size: 1rem;
    cursor: pointer;
  }
  #pantallaLogin button:disabled { opacity: 0.5; }
  #pantallaLogin .error {
    color: #ff6b6b;
    font-size: 0.85rem;
    min-height: 1.2em;
    margin-top: 10px;
  }

  /* ---------- APP ---------- */
  #appLicencias { padding: 24px; max-width: 1200px; margin: 0 auto; }
  #appLicencias[hidden] { display: none; }
  .cabecera {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
  }
  .cabecera h1 { color: #ffe600; font-size: 1.3rem; margin: 0; }
  .cabecera .acciones { display: flex; gap: 10px; flex-wrap: wrap; }
  button.btn {
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    background: #ffe600;
    color: #000;
    font-weight: 700;
    cursor: pointer;
    font-size: 0.85rem;
  }
  button.btn.secundario {
    background: rgba(255,255,255,0.1);
    color: #fff;
  }
  button.btn.peligro {
    background: #c0392b;
    color: #fff;
  }
  input#buscador {
    width: 100%;
    max-width: 320px;
    padding: 10px 12px;
    border-radius: 8px;
    border: none;
    font-size: 0.9rem;
  }
  .tabla-wrap { overflow-x: auto; border-radius: 12px; background: rgba(255,255,255,0.04); }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 1000px; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.08); }
  th { color: #ffe600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; }
  td input {
    width: 100%;
    background: rgba(255,255,255,0.08);
    border: 1px solid transparent;
    color: #fff;
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 0.85rem;
  }
  td input:focus { border-color: #ffe600; outline: none; background: rgba(255,255,255,0.14); }
  .codigo-txt { font-weight: 800; letter-spacing: 1px; color: #ffe600; }
  .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; inset: 0;
    background-color: #c0392b; border-radius: 24px; transition: 0.2s;
  }
  .slider::before {
    position: absolute; content: ""; height: 18px; width: 18px;
    left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: 0.2s;
  }
  input:checked + .slider { background-color: #27ae60; }
  input:checked + .slider::before { transform: translateX(22px); }
  .estado-txt { font-size: 0.75rem; font-weight: 700; margin-top: 4px; }
  .fecha-txt { color: #aaa; font-size: 0.78rem; white-space: nowrap; }
  .vacio { text-align: center; padding: 40px; color: #888; }
  .cargando { text-align: center; padding: 40px; color: #ffe600; }
  .mensaje-top {
    background: rgba(255,255,255,0.08);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    margin-bottom: 16px;
  }
</style>
</head>
<body>

<div id="pantallaLogin">
  <div class="caja">
    <h1>Panel de Licencias</h1>
    <form id="formLogin">
      <input type="email" id="loginEmail" placeholder="Email" autocomplete="username" required>
      <input type="password" id="loginPassword" placeholder="Contraseña" autocomplete="current-password" required>
      <button id="btnLogin" type="submit">ENTRAR</button>
      <div class="error" id="loginError" hidden></div>
    </form>
  </div>
</div>

<div id="appLicencias" hidden>
  <div class="cabecera">
    <h1>Licencias de tableros</h1>
    <div class="acciones">
      <input type="text" id="buscador" placeholder="Buscar por código o agencia...">
      <button class="btn secundario" id="btnActualizar" type="button">Actualizar</button>
      <button class="btn secundario" id="btnLogout" type="button">Salir</button>
    </div>
  </div>

  <div class="mensaje-top" id="mensajeTop" hidden></div>

  <div class="tabla-wrap">
    <table>
      <thead>
        <tr>
          <th>Código</th>
          <th>Activo</th>
          <th>Agencia</th>
          <th>Legajo</th>
          <th>Titular</th>
          <th>Provincia</th>
          <th>Notas</th>
          <th>Creado</th>
          <th>Activado</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="cuerpoTabla"></tbody>
    </table>
    <div class="cargando" id="cargando" hidden>Cargando...</div>
    <div class="vacio" id="vacio" hidden>No hay licencias registradas todavía.</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="licencias.js"></script>
</body>
</html>
